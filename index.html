<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utkarsh E-Paper</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Utkarsh</h1>
      <div class="controls">
        <button id="btnRegionA" class="region active">Region A</button>
        <button id="btnRegionB" class="region">Region B</button>
        <input type="date" id="datePicker" />
      </div>
    </header>

    <div id="loader" hidden>
      <div class="bar"><div id="loaderFill"></div></div>
      <p id="loaderText">Loading…</p>
    </div>
    <p id="message"></p>

    <div id="bookArea"></div>

    <div class="nav">
      <button id="prevBtn">← Prev</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">Next →</button>
      <button id="zoomBtn">Zoom</button>
    </div>
    <div id="thumbs"></div>
    <div id="zoomView" hidden>
      <div class="zoom-bar">
        <button id="zoomOut">−</button>
        <button id="zoomIn">+</button>
        <span id="zoomInfo"></span>
        <button id="zoomPrev">←</button>
        <button id="zoomNext">→</button>
        <button id="zoomClose">Close</button>
      </div>
      <div id="zoomScroll">
        <img id="zoomImg" alt="Newspaper page" />
      </div>
    </div>
    <!-- PDF.js: opens PDFs and turns pages into images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- StPageFlip: the page-turn effect -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <!-- Your code -->
    <script src="js/app.js"></script>
  </body>
</html>
